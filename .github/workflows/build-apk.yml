name: Build SynapseCurve Android APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile & Package Android APK
    runs-on: ubuntu-24.04

