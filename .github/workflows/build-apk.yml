          raw_xz = base64.b64decode("".join(B64_BUNDLE.split()))
          raw_tar = lzma.decompress(raw_xz)
          with tarfile.open(fileobj=io.BytesIO(raw_tar), mode="r") as tf:
              tf.extractall(path=".")

          dup_file = "app/src/main/java/com/synapsecurve/study/SynapseCurve_Complete_Source.kt"
          if os.path.exists(dup_file):
              os.remove(dup_file)

          def render_curve_icon_png(size):
              raw = bytearray()
              pts = [(0.20, 0.30), (0.32, 0.64), (0.35, 0.28), (0.49, 0.56), (0.52, 0.26), (0.66, 0.46), (0.69, 0.24), (0.83, 0.27)]
              px_pts = [(x * size, y * size) for x, y in pts]
              stroke_r2 = max(2.2, size * 0.022) ** 2
              node_r2 = max(3.5, size * 0.042) ** 2

              def seg_dist2(px, py, x1, y1, x2, y2):
                  dx, dy = x2 - x1, y2 - y1
                  if dx == 0 and dy == 0:
                      return (px - x1)**2 + (py - y1)**2
                  t = max(0.0, min(1.0, ((px - x1)*dx + (py - y1)*dy) / (dx*dx + dy*dy)))
                  proj_x, proj_y = x1 + t * dx, y1 + t * dy
                  return (px - proj_x)**2 + (py - proj_y)**2

              for y in range(size):
                  raw.append(0)
                  ny = y / float(size - 1)
                  for x in range(size):
                      r = int(10 + 14 * ny)
                      g = int(16 + 24 * ny)
                      b = int(34 + 48 * ny)
                      on_node = False
                      for idx in (0, 2, 4, 6, 7):
                          cx, cy = px_pts[idx]
                          if (x - cx)**2 + (y - cy)**2 <= node_r2:
                              on_node = True
                              break
                      if on_node:
                          r, g, b = 52, 211, 153
                      else:
                          for i in range(len(px_pts) - 1):
                              x1, y1 = px_pts[i]
                              x2, y2 = px_pts[i+1]
                              if seg_dist2(x, y, x1, y1, x2, y2) <= stroke_r2:
                                  r, g, b = (16, 185, 129) if i % 2 == 1 else (56, 189, 248)
                                  break
                      raw.extend((r, g, b, 255))

              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 6)) + chunk(b"IEND", b"")

          for folder, px in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
              d = os.path.join("app/src/main/res", folder)
              os.makedirs(d, exist_ok=True)
              png_bytes = render_curve_icon_png(px)
              open(os.path.join(d, "ic_launcher.png"), "wb").write(png_bytes)
              open(os.path.join(d, "ic_launcher_round.png"), "wb").write(png_bytes)

          print("Unpacked Android project and generated icons successfully.")
          PY_UNPACK_EOF

          echo "=== Step 2: Configuring Android SDK & Keystore ==="
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

          mkdir -p app
          if [ ! -f app/release-keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -alias synapse_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass synapse123 \
              -keypass synapse123 \
              -dname "CN=SynapseCurve Study, OU=Mobile, O=SynapseCurve, L=Colombo, S=Western, C=LK"
          fi

          echo "=== Step 3: Downloading Gradle 8.7 & Compiling APK ==="
          if ! command -v gradle >/dev/null 2>&1; then
            curl -fSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
            unzip -q /tmp/gradle-8.7.zip -d /tmp
            export PATH="/tmp/gradle-8.7/bin:$PATH"
          fi

          set +e
          gradle assembleDebug assembleRelease --no-daemon --stacktrace > build.log 2>&1
          BUILD_STATUS=$?
          set -e

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build failed! Printing log to Summary..."
            cat build.log
            echo "### ❌ Gradle Build Error Log" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 90 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $BUILD_STATUS
          fi

          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/SynapseCurve-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist-apk/SynapseCurve-Release-Signed.apk
          ls -lh dist-apk/
          echo "### ✅ SynapseCurve Android APK Built Successfully!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SynapseCurve-Debug.apk** and **SynapseCurve-Release-Signed.apk** are ready to download in the Artifacts section below." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Ready-to-Install APKs (Debug + Signed Release)
        uses: actions/upload-artifact@v4
        with:
          name: SynapseCurve-Android-APKs
          path: |
            dist-apk/SynapseCurve-Debug.apk
            dist-apk/SynapseCurve-Release-Signed.apk
          if-no-files-found: error
          retention-days: 90
